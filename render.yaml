# Free test deployment authorized by the project owner.
services:
  - type: web
    name: hordas-relay
    runtime: node
    rootDir: relay
    region: virginia
    plan: free
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "22"
      - key: METRICS_TOKEN
        generateValue: true
